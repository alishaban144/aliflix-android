name: Publish Aliflix Android

on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional version tag override. Defaults to the version in Gradle.'
        type: string
      notes:
        description: 'Release notes. Defaults to the selected commit subject.'
        type: string
      draft:
        description: 'Prepare and verify a draft without publishing it or deploying the Worker'
        type: boolean
        default: false
      reuse_run:
        description: 'Publish the verified draft from this Actions run ID at the same commit'
        type: string
      backend_only:
        description: 'Validate and deploy only the Worker'
        type: boolean
        default: false
      skip_tests:
        description: 'Explicitly waive Android and Worker test suites and Android lint'
        type: boolean
        default: false
      skip_device_tests:
        description: 'Explicitly waive emulator validation'
        type: boolean
        default: false
      validation_focus:
        description: 'Phone checks to run'
        type: choice
        options: [full, downloads, scene, motion]
        default: full
      run_live_ai_quality:
        description: 'Check live recommendation quality after deploying the Worker'
        type: boolean
        default: false

concurrency:
  group: aliflix-production-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPECTED_MOBILE_SIGNER_SHA256: a71ef174c31385c19f260027161ec255ad272ddbd7df1241a27029e8676f3a47

jobs:
  prepare:
    name: Plan release
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub requires push access to view a draft release.
      actions: read
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      version_code: ${{ steps.plan.outputs.version_code }}
      worker: ${{ steps.plan.outputs.worker }}
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_NOTES: ${{ inputs.notes }}
          DRAFT: ${{ inputs.draft }}
          BACKEND_ONLY: ${{ inputs.backend_only }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: python .github/scripts/mobile_release.py prepare
      - name: Restore the prior verification receipt
        if: steps.plan.outputs.reuse_run != ''
        uses: actions/download-artifact@v4
        with:
          name: verified-mobile-release
          path: release-bundle
          github-token: ${{ github.token }}
          run-id: ${{ steps.plan.outputs.reuse_run }}
      - name: Verify the draft before any deployment
        if: steps.plan.outputs.reuse_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/mobile_release.py verify

  open-draft:
    name: Open private GitHub draft
    needs: prepare
    if: ${{ !inputs.backend_only && needs.prepare.outputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/mobile_release.py open-draft

  package:
    name: Sign ${{ matrix.apk }}
    needs: [prepare, open-draft]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        apk: [aliflix-mobile.apk, aliflix-mobile-compat.apk]
    env:
      RELEASE_APK: ${{ matrix.apk }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build and verify signed APK
        env:
          RELEASE_VERSION_NAME: ${{ needs.prepare.outputs.version }}
          RELEASE_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          KEYSTORE_BASE64: ${{ secrets.ALIFLIX_KEYSTORE_BASE64 }}
          ALIFLIX_KEYSTORE_PASSWORD: ${{ secrets.ALIFLIX_KEYSTORE_PASSWORD }}
          ALIFLIX_KEY_ALIAS: ${{ secrets.ALIFLIX_KEY_ALIAS }}
          ALIFLIX_KEY_PASSWORD: ${{ secrets.ALIFLIX_KEY_PASSWORD }}
        run: bash .github/scripts/build-release-apk.sh
      - name: Stage APK on private draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/mobile_release.py upload-apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-digest-${{ matrix.apk }}
          path: ${{ matrix.apk }}.sha256
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  android-checks:
    name: Android unit tests and lint
    needs: prepare
    if: ${{ !inputs.backend_only && !inputs.skip_tests && needs.prepare.outputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: bash gradlew :app:testMobileDebugUnitTest :app:lintMobileDebug

  playback-device-tests:
    name: Phone playback tests
    needs: prepare
    if: ${{ !inputs.backend_only && !inputs.skip_device_tests && needs.prepare.outputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Verify phone playback
        env:
          VALIDATION_FOCUS: ${{ inputs.validation_focus || 'full' }}
        run: |
          case "$VALIDATION_FOCUS" in
            motion)
              export ALIFLIX_TEST_CLASSES='com.aliflix.app.talk.Talk193MotionDeviceTest,com.aliflix.app.talk.Talk192UiDeviceTest'
              ;;
            scene)
              export ALIFLIX_TEST_CLASSES='com.aliflix.app.talk.Talk187SceneDeviceTest,com.aliflix.app.talk.Talk188StoryDeviceTest,com.aliflix.app.talk.Talk189OrbDeviceTest,com.aliflix.app.talk.Talk190UiDeviceTest,com.aliflix.app.talk.Talk191UiDeviceTest,com.aliflix.app.talk.Talk192UiDeviceTest,com.aliflix.app.talk.TalkWireReplayDeviceTest,com.aliflix.app.talk.TalkOrbMotionDeviceTest'
              ;;
            downloads)
              export ALIFLIX_TEST_CLASSES='com.aliflix.app.player.OfflineDownloadTest'
              ;;
          esac
          bash .github/scripts/test-phone-casting.sh 35
      - name: Upload playback test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-device-test-reports-api-35
          include-hidden-files: true
          overwrite: true
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            .validation/emulator.log
            .validation/device-logcat.txt
            .validation/network-state.txt
            .validation/instrumentation.txt
            .validation/ui-screenshots/

  worker:
    name: Validate or deploy Worker
    needs: prepare
    if: needs.prepare.outputs.worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recommendation-worker
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: recommendation-worker/package-lock.json
      - run: npm ci
      - name: Typecheck and test the Worker
        if: needs.prepare.outputs.reuse_run == ''
        env:
          SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          set -euo pipefail
          npm run typecheck
          node --test ../.github/scripts/verify-ask-readiness.test.mjs
          if [[ "$SKIP_TESTS" != 'true' ]]; then
            npm test -- --maxWorkers=4
          fi
      - name: Deploy the verified Worker
        if: ${{ !inputs.draft }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2bd02586ce22e6e64d878d35d25e44c9
          OMDB_RELEASE_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          secret_names="$(npx wrangler secret list --format json)"
          if ! jq -e 'any(.[]; .name == "OMDB_API_KEY")' <<< "$secret_names" >/dev/null; then
            if [[ -z "$OMDB_RELEASE_KEY" ]]; then
              echo '::error::Set OMDB_API_KEY on the production Worker or add it as a GitHub Actions secret.'
              exit 1
            fi
            printf '%s' "$OMDB_RELEASE_KEY" | npx wrangler secret put OMDB_API_KEY
          fi
          # SQLite class migrations require a deployment.
          npx wrangler deploy
      - name: Verify live Worker
        if: ${{ !inputs.draft }}
        run: |
          node scripts/verify-watch-party.mjs
          node scripts/verify-browse.mjs
          node scripts/verify-omdb-awards.mjs
      - name: Verify live recommendation quality
        if: ${{ !inputs.draft && inputs.run_live_ai_quality }}
        run: node scripts/verify-cloudflare-recommendations.mjs

  verify-draft:
    name: Verify native parity and both updater manifests
    needs: [prepare, package, android-checks, playback-device-tests]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.package.result == 'success' &&
      (needs.android-checks.result == 'success' ||
       (inputs.skip_tests && needs.android-checks.result == 'skipped')) &&
      (needs.playback-device-tests.result == 'success' ||
       (inputs.skip_device_tests && needs.playback-device-tests.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-digest-*
          path: release-bundle
          merge-multiple: true
      - name: Verify the draft APKs and record their hashes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REQUESTED_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern aliflix-mobile.apk --pattern aliflix-mobile-compat.apk --dir release-bundle
          (cd release-bundle && sha256sum --check aliflix-mobile.apk.sha256 aliflix-mobile-compat.apk.sha256)
          gh release download v3.1.164 --pattern aliflix-mobile.apk --output baseline-mobile.apk
          python .github/scripts/verify-mobile-native.py baseline-mobile.apk release-bundle/aliflix-mobile.apk \
            --bridge release-bundle/aliflix-mobile-compat.apk --report release-bundle/native-parity.json
          python .github/scripts/mobile_release.py bundle
      - uses: actions/upload-artifact@v4
        with:
          name: verified-mobile-release
          path: release-bundle/receipt.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  readiness:
    name: Check live Ask publication readiness
    needs: [prepare, worker]
    if: >-
      !cancelled() && !inputs.draft && !inputs.backend_only && needs.prepare.result == 'success' &&
      (needs.worker.result == 'success' ||
       (needs.prepare.outputs.worker == 'false' && needs.worker.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - env:
          ALIFLIX_ASK_WAIT_MS: '7200000'
        run: node .github/scripts/verify-ask-readiness.mjs

  release:
    name: Publish or confirm verified draft
    needs: [prepare, verify-draft, worker, readiness]
    if: >-
      !cancelled() && !inputs.backend_only && needs.prepare.result == 'success' &&
      (needs.verify-draft.result == 'success' ||
       (needs.prepare.outputs.reuse_run != '' && needs.verify-draft.result == 'skipped')) &&
      (needs.worker.result == 'success' ||
       (needs.prepare.outputs.worker == 'false' && needs.worker.result == 'skipped')) &&
      (needs.readiness.result == 'success' || (inputs.draft && needs.readiness.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-mobile-release
          path: release-bundle
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.reuse_run || github.run_id }}
      - env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
        run: python .github/scripts/mobile_release.py publish
