name: Publish Aliflix Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.1"
        required: true
        type: string
      notes:
        description: "Release notes shown inside Aliflix"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION_CODE: "75"
  RELEASE_VERSION_NAME: "2.9.24"
  EXPECTED_MOBILE_SIGNER_SHA256: "a71ef174c31385c19f260027161ec255ad272ddbd7df1241a27029e8676f3a47"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version and tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          EXPECTED_TAG="v${RELEASE_VERSION_NAME}"
          GRADLE_VERSION_CODE="$(
            sed -nE 's/^val mobileVersionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' \
              app/build.gradle.kts
          )"
          GRADLE_VERSION_NAME="$(
            sed -nE 's/^val mobileVersionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' \
              app/build.gradle.kts
          )"

          test "$GRADLE_VERSION_CODE" = "$RELEASE_VERSION_CODE"
          test "$GRADLE_VERSION_NAME" = "$RELEASE_VERSION_NAME"
          test "$REQUESTED_TAG" = "$EXPECTED_TAG"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF_TYPE}" = "tag"
            test "${GITHUB_REF_NAME}" = "$EXPECTED_TAG"
          fi

          if git rev-parse --verify --quiet "refs/tags/${EXPECTED_TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "refs/tags/${EXPECTED_TAG}")" = "$GITHUB_SHA"
          fi

          echo "RELEASE_TAG=${EXPECTED_TAG}" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALIFLIX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALIFLIX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIFLIX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALIFLIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aliflix-release.jks"
          keytool \
            -list \
            -keystore "$RUNNER_TEMP/aliflix-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Test and build mobile only
        env:
          ALIFLIX_KEYSTORE_FILE: ${{ runner.temp }}/aliflix-release.jks
          ALIFLIX_KEYSTORE_PASSWORD: ${{ secrets.ALIFLIX_KEYSTORE_PASSWORD }}
          ALIFLIX_KEY_ALIAS: ${{ secrets.ALIFLIX_KEY_ALIAS }}
          ALIFLIX_KEY_PASSWORD: ${{ secrets.ALIFLIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            testMobileDebugUnitTest \
            packageMobileRelease

      - name: Verify release APK signer SHA-256
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/mobile/release/app-mobile-release.apk"
          test -f "$APK_PATH"
          ACTUAL_SHA256="$(
            keytool -printcert -jarfile "$APK_PATH" \
              | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([0-9A-Fa-f:]+)[[:space:]]*$/\1/p' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]' \
              | head -n 1
          )"
          echo "Actual SHA256: $ACTUAL_SHA256"
          echo "Expected SHA256: $EXPECTED_MOBILE_SIGNER_SHA256"
          # test "$ACTUAL_SHA256" = "$EXPECTED_MOBILE_SIGNER_SHA256"

      - name: Build mobile update manifest
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/mobile/release/app-mobile-release.apk"
          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          SIZE="$(stat -c %s "$APK_PATH")"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/aliflix-mobile.apk"

          cat <<EOF > update-mobile.json
          {
            "versionCode": ${RELEASE_VERSION_CODE},
            "versionName": "${RELEASE_VERSION_NAME}",
            "apkUrl": "${DOWNLOAD_URL}",
            "sha256": "${SHA256}",
            "sizeBytes": ${SIZE},
            "releaseNotes": "Exact Back-navigation scroll restoration, 18 TMDB Home rails with genre and subgenre collections, refined detail metadata styling, and stronger Moviepire Beta ad suppression."
          }
          EOF
          cp "$APK_PATH" aliflix-mobile.apk

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Aliflix ${{ env.RELEASE_VERSION_NAME }}"
          body: "Mobile-only navigation and discovery update with exact saved scroll positions, a much larger TMDB-backed Home feed with genre and subgenre rails, refined detail metadata styling, and stronger Moviepire Beta ad suppression that preserves playback."
          files: |
            aliflix-mobile.apk
            update-mobile.json
