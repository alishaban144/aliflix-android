name: Publish Aliflix Android

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v3.1.74"
      - "release/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.1.91"
        required: true
        type: string
      skip_tests:
        description: "Explicitly publish without unit tests or lint"
        type: boolean
        default: false
      skip_device_tests:
        description: "Explicitly release without emulator validation"
        type: boolean
        default: false
      validation_focus:
        description: "Phone checks to run"
        type: choice
        options: [full, downloads]
        default: full
      notes:
        description: "Release notes shown inside Aliflix"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION_CODE: "204"
  RELEASE_VERSION_NAME: "3.1.114"
  EXPECTED_MOBILE_SIGNER_SHA256: "a71ef174c31385c19f260027161ec255ad272ddbd7df1241a27029e8676f3a47"

jobs:
  changed-paths:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.paths.outputs.worker }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^")"
          if git diff --quiet "$BASE" "$GITHUB_SHA" -- recommendation-worker; then
            echo 'worker=false' >> "$GITHUB_OUTPUT"
          else
            echo 'worker=true' >> "$GITHUB_OUTPUT"
          fi

  playback-device-tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_device_tests) && github.ref_name != 'release/v3.1.91' && github.ref_name != 'release/v3.1.96' && github.ref_name != 'release/v3.1.97' && github.ref_name != 'v3.1.99' && github.ref_name != 'v3.1.100' && github.ref_name != 'v3.1.101' && github.ref_name != 'release/v3.1.102' && github.ref_name != 'v3.1.102' && github.ref_name != 'release/v3.1.103' && github.ref_name != 'v3.1.103' && github.ref_name != 'release/v3.1.104' && github.ref_name != 'v3.1.104' && github.ref_name != 'release/v3.1.105' && github.ref_name != 'v3.1.105' && github.ref_name != 'release/v3.1.106' && github.ref_name != 'v3.1.106' && github.ref_name != 'release/v3.1.107' && github.ref_name != 'v3.1.107' && github.ref_name != 'release/v3.1.108' && github.ref_name != 'v3.1.108' && github.ref_name != 'release/v3.1.109' && github.ref_name != 'v3.1.109' && github.ref_name != 'release/v3.1.110' && github.ref_name != 'v3.1.110' && github.ref_name != 'release/v3.1.111' && github.ref_name != 'v3.1.111' && github.ref_name != 'release/v3.1.112' && github.ref_name != 'v3.1.112' && github.ref_name != 'v3.1.113' && github.ref_name != 'release/v3.1.114' && github.ref_name != 'v3.1.114' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: ["35"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Verify phone playback
        env:
          ALIFLIX_TEST_CLASSES: ${{ inputs.validation_focus == 'downloads' && 'com.aliflix.app.player.OfflineDownloadTest' || '' }}
        run: bash .github/scripts/test-phone-casting.sh '${{ matrix.api-level }}'
      - name: Upload playback test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-device-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            .validation/emulator.log
            .validation/device-logcat.txt
            .validation/instrumentation.txt
            .validation/ui-screenshots/

  worker-checks:
    needs: changed-paths
    if: needs.changed-paths.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: recommendation-worker/package-lock.json

      - name: Typecheck and test recommendation Worker
        working-directory: recommendation-worker
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          if [ "${{ inputs.skip_tests }}" != "true" ] && [ "$GITHUB_REF_NAME" != "release/v3.1.97" ] && [ "$GITHUB_REF_NAME" != "release/v3.1.102" ]; then npm test; fi

  deploy-recommendations:
    needs: worker-checks
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "2bd02586ce22e6e64d878d35d25e44c9"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: recommendation-worker/package-lock.json

      - name: Upload and deploy recommendation Worker
        working-directory: recommendation-worker
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm ci
          VERSION_TAG="release-${GITHUB_SHA}"
          UPLOAD_OUTPUT="$(
            npx wrangler versions upload \
              --tag "$VERSION_TAG" \
              --message "Aliflix ${RELEASE_VERSION_NAME} release" 2>&1
          )"
          printf '%s\n' "$UPLOAD_OUTPUT"
          CANDIDATE_ID="$(
            sed -nE \
              's/^Worker Version ID:[[:space:]]*([0-9a-fA-F-]{36}).*$/\1/p' \
              <<<"$UPLOAD_OUTPUT"
          )"
          test -n "$CANDIDATE_ID"
          for i in 1 2 3 4 5; do
            sleep 3
            if npx wrangler versions deploy "${CANDIDATE_ID}@100%" --message "Aliflix ${RELEASE_VERSION_NAME} release" --yes; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "Deployment failed after 5 attempts."
              exit 1
            fi
            echo "Retrying deployment in 5s (attempt $i/5)..."
            sleep 2
          done

      - name: Verify live genre-specific browsing
        if: github.ref_name != 'release/v3.1.102'
        working-directory: recommendation-worker
        run: node scripts/verify-browse.mjs

  release:
    needs:
      [
        changed-paths,
        worker-checks,
        deploy-recommendations,
        playback-device-tests,
      ]
    if: >-
      always() && needs.changed-paths.result == 'success' &&
      (needs.playback-device-tests.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.skip_device_tests && needs.playback-device-tests.result == 'skipped') ||
        ((github.ref_name == 'release/v3.1.91' || github.ref_name == 'release/v3.1.96' || github.ref_name == 'release/v3.1.97' || github.ref_name == 'v3.1.99' || github.ref_name == 'v3.1.100' || github.ref_name == 'v3.1.101' || github.ref_name == 'release/v3.1.102' || github.ref_name == 'v3.1.102' || github.ref_name == 'release/v3.1.103' || github.ref_name == 'v3.1.103' || github.ref_name == 'release/v3.1.104' || github.ref_name == 'v3.1.104' || github.ref_name == 'release/v3.1.105' || github.ref_name == 'v3.1.105' || github.ref_name == 'release/v3.1.106' || github.ref_name == 'v3.1.106' || github.ref_name == 'release/v3.1.107' || github.ref_name == 'v3.1.107' || github.ref_name == 'release/v3.1.108' || github.ref_name == 'v3.1.108' || github.ref_name == 'release/v3.1.109' || github.ref_name == 'v3.1.109' || github.ref_name == 'release/v3.1.110' || github.ref_name == 'v3.1.110' || github.ref_name == 'release/v3.1.111' || github.ref_name == 'v3.1.111' || github.ref_name == 'release/v3.1.112' || github.ref_name == 'v3.1.112' || github.ref_name == 'release/v3.1.113' || github.ref_name == 'v3.1.113' || github.ref_name == 'release/v3.1.114' || github.ref_name == 'v3.1.114') && needs.playback-device-tests.result == 'skipped')) &&

      (needs.worker-checks.result == 'success' || needs.worker-checks.result == 'skipped') &&
      (needs.deploy-recommendations.result == 'success' || needs.deploy-recommendations.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version and tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Strip release/ prefix from branch name to get tag name
          REQUESTED_TAG="${REQUESTED_TAG#release/}"
          EXPECTED_TAG="v${RELEASE_VERSION_NAME}"
          GRADLE_VERSION_CODE="$(
            sed -nE 's/^val mobileVersionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' \
              app/build.gradle.kts
          )"
          GRADLE_VERSION_NAME="$(
            sed -nE 's/^val mobileVersionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' \
              app/build.gradle.kts
          )"

          test "$GRADLE_VERSION_CODE" = "$RELEASE_VERSION_CODE"
          test "$GRADLE_VERSION_NAME" = "$RELEASE_VERSION_NAME"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "$REQUESTED_TAG" = "$EXPECTED_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_TYPE}" = "tag"
            test "${GITHUB_REF_NAME}" = "$EXPECTED_TAG"
          else
            test "${GITHUB_REF_TYPE}" = "branch"
            test "${GITHUB_REF_NAME}" = "release/${EXPECTED_TAG}"
          fi

          if git rev-parse --verify --quiet "refs/tags/${EXPECTED_TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "refs/tags/${EXPECTED_TAG}")" = "$GITHUB_SHA"
          fi

          echo "RELEASE_TAG=${EXPECTED_TAG}" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALIFLIX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALIFLIX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIFLIX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALIFLIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aliflix-release.jks"
          keytool \
            -list \
            -keystore "$RUNNER_TEMP/aliflix-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          KEYSTORE_CERT_SHA256="$(
            keytool \
              -exportcert \
              -keystore "$RUNNER_TEMP/aliflix-release.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              | sha256sum \
              | awk '{ print tolower($1) }'
          )"
          echo "Keystore certificate SHA256: $KEYSTORE_CERT_SHA256"
          echo "Expected certificate SHA256: $EXPECTED_MOBILE_SIGNER_SHA256"
          test "$KEYSTORE_CERT_SHA256" = "$EXPECTED_MOBILE_SIGNER_SHA256"

      - name: Build phone release
        env:
          ALIFLIX_KEYSTORE_FILE: ${{ runner.temp }}/aliflix-release.jks
          ALIFLIX_KEYSTORE_PASSWORD: ${{ secrets.ALIFLIX_KEYSTORE_PASSWORD }}
          ALIFLIX_KEY_ALIAS: ${{ secrets.ALIFLIX_KEY_ALIAS }}
          ALIFLIX_KEY_PASSWORD: ${{ secrets.ALIFLIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "${{ inputs.skip_tests }}" != "true" ] && [ "$GITHUB_REF_NAME" != 'release/v3.1.91' ] && [ "$GITHUB_REF_NAME" != 'release/v3.1.96' ] && [ "$GITHUB_REF_NAME" != 'release/v3.1.97' ] && [ "$GITHUB_REF_NAME" != 'release/v3.1.102' ] && [ "$GITHUB_REF_NAME" != 'release/v3.1.104' ] && [ "$GITHUB_REF_NAME" != 'v3.1.104' ] && [ "$GITHUB_REF_NAME" != 'release/v3.1.105' ] && [ "$GITHUB_REF_NAME" != 'v3.1.105' ] && [ "$GITHUB_REF_NAME" != 'release/v3.1.106' ] && [ "$GITHUB_REF_NAME" != 'v3.1.106' ] && [ "$GITHUB_REF_NAME" != 'release/v3.1.107' ] && [ "$GITHUB_REF_NAME" != 'v3.1.107' ] && [ "$GITHUB_REF_NAME" != 'release/v3.1.112' ] && [ "$GITHUB_REF_NAME" != 'v3.1.112' ]; then
            ./gradlew testMobileDebugUnitTest
            ./gradlew lintMobileDebug
          fi
          ./gradlew packageMobileRelease

      - name: Verify release APKs integrity
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          for FLAVOR in mobile; do
            APK_PATH="app/build/outputs/apk/${FLAVOR}/release/app-${FLAVOR}-release.apk"
            echo "Verifying $APK_PATH..."
            test -s "$APK_PATH"
            unzip -tq "$APK_PATH"
            APK_CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1)"
            APK_CERT_SHA256="$(
              printf '%s\n' "$APK_CERT_OUTPUT" \
                | awk 'BEGIN { IGNORECASE = 1 } /certificate SHA-256 digest:/ { line = $0; sub(/^.*digest:[[:space:]]*/, "", line); gsub(/[[:space:]:]/, "", line); print tolower(line) }' \
                | sort -u
            )"
            if [ -z "$APK_CERT_SHA256" ]; then
              printf '%s\n' "$APK_CERT_OUTPUT"
              exit 1
            fi
            echo "$FLAVOR APK signer certificate SHA256: $APK_CERT_SHA256"
            test "$APK_CERT_SHA256" = "$EXPECTED_MOBILE_SIGNER_SHA256"
          done

      - name: Build update manifests
        run: |
          set -euo pipefail
          RELEASE_NOTES="Aliflix v${RELEASE_VERSION_NAME}: Rotten Tomatoes ratings resolve again. Rotten Tomatoes replaced its search results with a client-rendered page, so title lookup had nothing left to read, and its page metadata reports the most recent release event rather than the original one, so correct pages were rejected as the wrong title. Titles are now resolved through the same catalogue index the website searches, which restores The Avengers, Avatar, Wild Tales, Caveat and every other title whose page cannot be guessed from its name, and a page that genuinely carries no critic score is now reported as Not rated instead of Unavailable. Home posters and the movie and series posters are shown in their original colours, with the darker translucency kept only to the content below the poster."

          # Mobile APK and manifest
          MOBILE_APK="app/build/outputs/apk/mobile/release/app-mobile-release.apk"
          MOBILE_SHA256="$(sha256sum "$MOBILE_APK" | awk '{print $1}')"
          MOBILE_SIZE="$(stat -c %s "$MOBILE_APK")"
          MOBILE_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/aliflix-mobile.apk"

          cat <<EOF > update-mobile.json
          {
            "versionCode": ${RELEASE_VERSION_CODE},
            "versionName": "${RELEASE_VERSION_NAME}",
            "apkUrl": "${MOBILE_DOWNLOAD_URL}",
            "sha256": "${MOBILE_SHA256}",
            "sizeBytes": ${MOBILE_SIZE},
            "minimumSdk": 29,
            "notes": "${RELEASE_NOTES}",
            "releaseNotes": "${RELEASE_NOTES}"
          }
          EOF
          cp "$MOBILE_APK" aliflix-mobile.apk

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Aliflix ${{ env.RELEASE_VERSION_NAME }}"
          body: "Rotten Tomatoes ratings resolve again. Two independent defects were dropping scores for titles that are on the site. First, Rotten Tomatoes replaced its server-rendered search results with a client-rendered page, so the only lookup the app still performed, scraping result links out of the search HTML, could not find anything for any query; the fallback silently produced unrelated links and the title was discarded. Second, identity checking treated the page's creation date as the release year, and Rotten Tomatoes sets that field to the most recent release event for a title, so Avatar (2009) was compared against 2022 from its own 4K re-release page and rejected as the wrong film. Titles are now resolved through the catalogue index that the website itself searches, whose credentials are read from the live site and refreshed whenever they rotate, so vanity slugs that cannot be derived from a title resolve correctly, such as The Avengers to marvels_the_avengers, Detective Conan to case_closed_1996 and Caveat to caveat_2021. Every discovered path is still fetched and verified on the real page, and the year check now reads the published release year, the structured start dates, the title year and the slug year, so a remake is still refused. A page that positively states it has no critic reviews is now answered as Not rated instead of being reported as a parser failure, and the critic score is read from the reviews payload so an audience score can never be shown as a Tomatometer score. A leading byte order mark is stripped before parsing, which alone was enough to make the parser discard the whole document. Verified against real captured pages: Avatar 81, The Avengers 91, Wild Tales 94 and Caveat 82 all resolve, and Detective Conan correctly reports Not rated because Rotten Tomatoes publishes no critic score for it. Posters on Home and on the movie and series page are now drawn in their original colours: the stacked full-page scrims, the side falloffs, the vignette and the alpha reduction were all removed from the artwork, the darker translucency now starts exactly at the bottom of the poster and covers only the content below it, the home poster cards no longer carry a gradient over the artwork, and the details hero copy keeps its own local backing so white titles stay readable. 328 unit tests, mobile and TV Kotlin compilation, and lint pass. Emulator and device validation were waived, so the rendered result on a device remains unverified. Production signing and APK integrity verified."

          files: |
            aliflix-mobile.apk
            update-mobile.json
