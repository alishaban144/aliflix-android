name: Publish Aliflix Android

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v3.1.74"
      - "release/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.1.91"
        required: true
        type: string
      skip_tests:
        description: "Explicitly publish without unit tests or lint"
        type: boolean
        default: false
      skip_device_tests:
        description: "Explicitly release without emulator validation"
        type: boolean
        default: false
      backend_only:
        description: "Validate and deploy the mobile speech backend without publishing an APK"
        type: boolean
        default: false
      validation_focus:
        description: "Phone checks to run"
        type: choice
        options: [full, downloads]
        default: full
      notes:
        description: "Release notes shown inside Aliflix"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION_CODE: "262"
  RELEASE_VERSION_NAME: "3.1.172"
  EXPECTED_MOBILE_SIGNER_SHA256: "a71ef174c31385c19f260027161ec255ad272ddbd7df1241a27029e8676f3a47"

jobs:
  changed-paths:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.paths.outputs.worker }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^")"
          if git diff --quiet "$BASE" "$GITHUB_SHA" -- recommendation-worker; then
            echo 'worker=false' >> "$GITHUB_OUTPUT"
          else
            echo 'worker=true' >> "$GITHUB_OUTPUT"
          fi

  playback-device-tests:
    # v3.1.157: the user explicitly waived emulator/device testing; retain unit/lint/signing gates.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.backend_only) && github.ref_name != 'release/v3.1.157' && github.ref_name != 'v3.1.157' && github.ref_name != 'release/v3.1.156' && github.ref_name != 'v3.1.156' && github.ref_name != 'release/v3.1.150' && github.ref_name != 'v3.1.150' && github.ref_name != 'release/v3.1.148' && github.ref_name != 'v3.1.148' && !(github.event_name == 'workflow_dispatch' && inputs.skip_device_tests) && github.ref_name != 'release/v3.1.91' && github.ref_name != 'release/v3.1.96' && github.ref_name != 'release/v3.1.97' && github.ref_name != 'v3.1.99' && github.ref_name != 'v3.1.100' && github.ref_name != 'v3.1.101' && github.ref_name != 'release/v3.1.102' && github.ref_name != 'v3.1.102' && github.ref_name != 'release/v3.1.103' && github.ref_name != 'v3.1.103' && github.ref_name != 'release/v3.1.104' && github.ref_name != 'v3.1.104' && github.ref_name != 'release/v3.1.105' && github.ref_name != 'v3.1.105' && github.ref_name != 'release/v3.1.106' && github.ref_name != 'v3.1.106' && github.ref_name != 'release/v3.1.107' && github.ref_name != 'v3.1.107' && github.ref_name != 'release/v3.1.108' && github.ref_name != 'v3.1.108' && github.ref_name != 'release/v3.1.109' && github.ref_name != 'v3.1.109' && github.ref_name != 'release/v3.1.110' && github.ref_name != 'v3.1.110' && github.ref_name != 'release/v3.1.111' && github.ref_name != 'v3.1.111' && github.ref_name != 'release/v3.1.112' && github.ref_name != 'v3.1.112' && github.ref_name != 'v3.1.113' && github.ref_name != 'release/v3.1.114' && github.ref_name != 'v3.1.114' && github.ref_name != 'release/v3.1.115' && github.ref_name != 'v3.1.115' && github.ref_name != 'release/v3.1.116' && github.ref_name != 'v3.1.116' && github.ref_name != 'release/v3.1.117' && github.ref_name != 'v3.1.117' && github.ref_name != 'release/v3.1.118' && github.ref_name != 'v3.1.118' && github.ref_name != 'release/v3.1.119' && github.ref_name != 'v3.1.119' && github.ref_name != 'release/v3.1.120' && github.ref_name != 'v3.1.120' && github.ref_name != 'release/v3.1.121' && github.ref_name != 'v3.1.121' && github.ref_name != 'release/v3.1.122' && github.ref_name != 'v3.1.122' && github.ref_name != 'release/v3.1.123' && github.ref_name != 'v3.1.123' && github.ref_name != 'release/v3.1.124' && github.ref_name != 'v3.1.124' && github.ref_name != 'release/v3.1.125' && github.ref_name != 'v3.1.125' && github.ref_name != 'release/v3.1.126' && github.ref_name != 'v3.1.126' && github.ref_name != 'release/v3.1.128' && github.ref_name != 'v3.1.128' && github.ref_name != 'release/v3.1.129' && github.ref_name != 'v3.1.129' && github.ref_name != 'release/v3.1.130' && github.ref_name != 'v3.1.130' && github.ref_name != 'release/v3.1.131' && github.ref_name != 'v3.1.131' && github.ref_name != 'release/v3.1.132' && github.ref_name != 'release/v3.1.133' && github.ref_name != 'v3.1.133' && github.ref_name != 'release/v3.1.134' && github.ref_name != 'v3.1.134' && github.ref_name != 'release/v3.1.135' && github.ref_name != 'v3.1.135' && github.ref_name != 'release/v3.1.136' && github.ref_name != 'v3.1.136' && github.ref_name != 'release/v3.1.137' && github.ref_name != 'v3.1.137' && github.ref_name != 'release/v3.1.138' && github.ref_name != 'v3.1.138' && github.ref_name != 'release/v3.1.139' && github.ref_name != 'v3.1.139' && github.ref_name != 'release/v3.1.140' && github.ref_name != 'v3.1.140' && github.ref_name != 'release/v3.1.142' && github.ref_name != 'v3.1.142' && github.ref_name != 'release/v3.1.141' && github.ref_name != 'v3.1.141' && github.ref_name != 'release/v3.1.143' && github.ref_name != 'v3.1.143' && github.ref_name != 'release/v3.1.144' && github.ref_name != 'v3.1.144' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: ["35"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Verify phone playback
        env:
          ALIFLIX_TEST_CLASSES: ${{ (github.ref_name == 'release/v3.1.155' || github.ref_name == 'v3.1.155' || github.ref_name == 'release/v3.1.153' || github.ref_name == 'release/v3.1.154' || github.ref_name == 'v3.1.154' || github.ref_name == 'v3.1.153' || github.ref_name == 'release/v3.1.152' || github.ref_name == 'v3.1.152') && 'com.aliflix.app.downloads.DownloadBatchUiTest,com.aliflix.app.player.OfflineDownloadTest,com.aliflix.app.player.NativeSkipControlsTest,com.aliflix.app.player.NativeUpNextDeviceTest,com.aliflix.app.player.NativeResolverSilenceTest,com.aliflix.app.player.MobileResumeDeviceTest' || (github.ref_name == 'release/v3.1.151' || github.ref_name == 'v3.1.151') && 'com.aliflix.app.player.NativeSkipControlsTest' || (inputs.validation_focus == 'downloads' && 'com.aliflix.app.player.OfflineDownloadTest' || '') }}
        run: bash .github/scripts/test-phone-casting.sh '${{ matrix.api-level }}'
      - name: Upload playback test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-device-test-reports-api-${{ matrix.api-level }}
          include-hidden-files: true
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            .validation/emulator.log
            .validation/device-logcat.txt
            .validation/network-state.txt
            .validation/instrumentation.txt
            .validation/ui-screenshots/

  worker-checks:
    needs: changed-paths
    if: needs.changed-paths.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: recommendation-worker/package-lock.json

      - name: Typecheck and test recommendation Worker
        working-directory: recommendation-worker
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          if [ "${{ inputs.skip_tests }}" != "true" ] && [ "$GITHUB_REF_NAME" != "release/v3.1.97" ] && [ "$GITHUB_REF_NAME" != "release/v3.1.102" ] && [ "$GITHUB_REF_NAME" != "release/v3.1.128" ]; then npm test; fi

  deploy-recommendations:
    needs: worker-checks
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "2bd02586ce22e6e64d878d35d25e44c9"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: recommendation-worker/package-lock.json

      - name: Upload and deploy recommendation Worker
        working-directory: recommendation-worker
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm ci
          # SQLite class migrations require a deployment, not a gradual versions upload.
          npx wrangler deploy

      - name: Verify live Watch Party protocol
        working-directory: recommendation-worker
        run: node scripts/verify-watch-party.mjs

      - name: Verify live genre-specific browsing
        if: github.ref_name != 'release/v3.1.102'
        working-directory: recommendation-worker
        run: node scripts/verify-browse.mjs

      - name: Verify live Cloudflare recommendation quality
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_ai_quality }}
        working-directory: recommendation-worker
        run: node scripts/verify-cloudflare-recommendations.mjs

  release:
    needs:
      [
        changed-paths,
        worker-checks,
        deploy-recommendations,
        playback-device-tests,
      ]
    if: >-
      always() && !inputs.backend_only && needs.changed-paths.result == 'success' &&
      (needs.playback-device-tests.result == 'success' ||
       ((github.ref_name == 'release/v3.1.157' || github.ref_name == 'v3.1.157' || github.ref_name == 'release/v3.1.156' || github.ref_name == 'v3.1.156' || github.ref_name == 'release/v3.1.150' || github.ref_name == 'v3.1.150' || github.ref_name == 'release/v3.1.148' || github.ref_name == 'v3.1.148') && needs.playback-device-tests.result == 'skipped') ||
       (github.event_name == 'workflow_dispatch' && inputs.skip_device_tests && needs.playback-device-tests.result == 'skipped') ||
        ((github.ref_name == 'release/v3.1.91' || github.ref_name == 'release/v3.1.96' || github.ref_name == 'release/v3.1.97' || github.ref_name == 'v3.1.99' || github.ref_name == 'v3.1.100' || github.ref_name == 'v3.1.101' || github.ref_name == 'release/v3.1.102' || github.ref_name == 'v3.1.102' || github.ref_name == 'release/v3.1.103' || github.ref_name == 'v3.1.103' || github.ref_name == 'release/v3.1.104' || github.ref_name == 'v3.1.104' || github.ref_name == 'release/v3.1.105' || github.ref_name == 'v3.1.105' || github.ref_name == 'release/v3.1.106' || github.ref_name == 'v3.1.106' || github.ref_name == 'release/v3.1.107' || github.ref_name == 'v3.1.107' || github.ref_name == 'release/v3.1.108' || github.ref_name == 'v3.1.108' || github.ref_name == 'release/v3.1.109' || github.ref_name == 'v3.1.109' || github.ref_name == 'release/v3.1.110' || github.ref_name == 'v3.1.110' || github.ref_name == 'release/v3.1.111' || github.ref_name == 'v3.1.111' || github.ref_name == 'release/v3.1.112' || github.ref_name == 'v3.1.112' || github.ref_name == 'release/v3.1.113' || github.ref_name == 'v3.1.113' || github.ref_name == 'release/v3.1.114' || github.ref_name == 'v3.1.114' || github.ref_name == 'release/v3.1.115' || github.ref_name == 'v3.1.115' || github.ref_name == 'release/v3.1.116' || github.ref_name == 'v3.1.116' || github.ref_name == 'release/v3.1.117' || github.ref_name == 'v3.1.117' || github.ref_name == 'release/v3.1.118' || github.ref_name == 'v3.1.118' || github.ref_name == 'release/v3.1.119' || github.ref_name == 'v3.1.119' || github.ref_name == 'release/v3.1.120' || github.ref_name == 'v3.1.120' || github.ref_name == 'release/v3.1.121' || github.ref_name == 'v3.1.121' || github.ref_name == 'release/v3.1.122' || github.ref_name == 'v3.1.122' || github.ref_name == 'release/v3.1.123' || github.ref_name == 'v3.1.123' || github.ref_name == 'release/v3.1.124' || github.ref_name == 'v3.1.124' || github.ref_name == 'release/v3.1.125' || github.ref_name == 'v3.1.125' || github.ref_name == 'release/v3.1.126' || github.ref_name == 'v3.1.126' || github.ref_name == 'release/v3.1.128' || github.ref_name == 'v3.1.128' || github.ref_name == 'release/v3.1.129' || github.ref_name == 'v3.1.129' || github.ref_name == 'release/v3.1.130' || github.ref_name == 'v3.1.130' || github.ref_name == 'release/v3.1.131' || github.ref_name == 'v3.1.131' || github.ref_name == 'release/v3.1.132' || github.ref_name == 'release/v3.1.133' || github.ref_name == 'v3.1.133' || github.ref_name == 'release/v3.1.134' || github.ref_name == 'v3.1.134' || github.ref_name == 'release/v3.1.135' || github.ref_name == 'v3.1.135' || github.ref_name == 'release/v3.1.136' || github.ref_name == 'v3.1.136' || github.ref_name == 'release/v3.1.137' || github.ref_name == 'v3.1.137' || github.ref_name == 'release/v3.1.138' || github.ref_name == 'v3.1.138' || github.ref_name == 'release/v3.1.139' || github.ref_name == 'v3.1.139' || github.ref_name == 'release/v3.1.140' || github.ref_name == 'v3.1.140' || github.ref_name == 'release/v3.1.142' || github.ref_name == 'v3.1.142' || github.ref_name == 'release/v3.1.141' || github.ref_name == 'v3.1.141' || github.ref_name == 'release/v3.1.143' || github.ref_name == 'v3.1.143' || github.ref_name == 'release/v3.1.144' || github.ref_name == 'v3.1.144') && needs.playback-device-tests.result == 'skipped')) &&

      (needs.worker-checks.result == 'success' || needs.worker-checks.result == 'skipped') &&
      (needs.deploy-recommendations.result == 'success' || needs.deploy-recommendations.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version and tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Strip release/ prefix from branch name to get tag name
          REQUESTED_TAG="${REQUESTED_TAG#release/}"
          EXPECTED_TAG="v${RELEASE_VERSION_NAME}"
          GRADLE_VERSION_CODE="$(
            sed -nE 's/^val mobileVersionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' \
              app/build.gradle.kts
          )"
          GRADLE_VERSION_NAME="$(
            sed -nE 's/^val mobileVersionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' \
              app/build.gradle.kts
          )"

          test "$GRADLE_VERSION_CODE" = "$RELEASE_VERSION_CODE"
          test "$GRADLE_VERSION_NAME" = "$RELEASE_VERSION_NAME"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "$REQUESTED_TAG" = "$EXPECTED_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_TYPE}" = "tag"
            test "${GITHUB_REF_NAME}" = "$EXPECTED_TAG"
          else
            test "${GITHUB_REF_TYPE}" = "branch"
            test "${GITHUB_REF_NAME}" = "release/${EXPECTED_TAG}"
          fi

          if git rev-parse --verify --quiet "refs/tags/${EXPECTED_TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "refs/tags/${EXPECTED_TAG}")" = "$GITHUB_SHA"
          fi

          echo "RELEASE_TAG=${EXPECTED_TAG}" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALIFLIX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALIFLIX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIFLIX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALIFLIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aliflix-release.jks"
          keytool \
            -list \
            -keystore "$RUNNER_TEMP/aliflix-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          KEYSTORE_CERT_SHA256="$(
            keytool \
              -exportcert \
              -keystore "$RUNNER_TEMP/aliflix-release.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              | sha256sum \
              | awk '{ print tolower($1) }'
          )"
          echo "Keystore certificate SHA256: $KEYSTORE_CERT_SHA256"
          echo "Expected certificate SHA256: $EXPECTED_MOBILE_SIGNER_SHA256"
          test "$KEYSTORE_CERT_SHA256" = "$EXPECTED_MOBILE_SIGNER_SHA256"

      - name: Build phone release
        env:
          ALIFLIX_KEYSTORE_FILE: ${{ runner.temp }}/aliflix-release.jks
          ALIFLIX_KEYSTORE_PASSWORD: ${{ secrets.ALIFLIX_KEYSTORE_PASSWORD }}
          ALIFLIX_KEY_ALIAS: ${{ secrets.ALIFLIX_KEY_ALIAS }}
          ALIFLIX_KEY_PASSWORD: ${{ secrets.ALIFLIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          # v3.1.141: verify CineJoy media chunks and pin a working video rendition; mobile only.
          if [ "$GITHUB_REF_NAME" = 'release/v3.1.141' ] || [ "$GITHUB_REF_NAME" = 'v3.1.141' ]; then
            ./gradlew :app:testMobileDebugUnitTest --tests 'com.aliflix.app.player.CineJoyNativeCatalogTest' --tests 'com.aliflix.app.player.NativePlaybackRequestTest' --tests 'com.aliflix.app.player.NativeServerPinTest'
          else
          # v3.1.140: keep CineJoy and its audio selected during seek recovery; mobile only.
          if [ "$GITHUB_REF_NAME" = 'release/v3.1.140' ] || [ "$GITHUB_REF_NAME" = 'v3.1.140' ]; then
            ./gradlew :app:testMobileDebugUnitTest --tests 'com.aliflix.app.player.CineJoyNativeCatalogTest' --tests 'com.aliflix.app.player.PlaybackSourceFallbackTest' --tests 'com.aliflix.app.player.NativeServerPinTest'
          else
          # v3.1.139: CineJoy multivariant audio and selectable offline audio; mobile only.
          if [ "$GITHUB_REF_NAME" = 'release/v3.1.139' ] || [ "$GITHUB_REF_NAME" = 'v3.1.139' ]; then
            ./gradlew :app:testMobileDebugUnitTest --tests 'com.aliflix.app.player.NativePlaybackRequestTest' --tests 'com.aliflix.app.player.CineJoyNativeCatalogTest' --tests 'com.aliflix.app.player.PlaybackSourceFallbackTest' --tests 'com.aliflix.app.downloads.DownloadPreparationBatchTest'
          else
          # v3.1.137: focused playlist and source-preference checks; mobile only.
          if [ "$GITHUB_REF_NAME" = 'release/v3.1.137' ] || [ "$GITHUB_REF_NAME" = 'v3.1.137' ]; then
            ./gradlew :app:testMobileDebugUnitTest --tests 'com.aliflix.app.player.NativePlaybackRequestTest' --tests 'com.aliflix.app.player.PlaybackSourceFallbackTest'
          else
          # v3.1.135: focused current-dialogue checks; no emulator or heavy checks.
          if [ "$GITHUB_REF_NAME" = 'release/v3.1.136' ] || [ "$GITHUB_REF_NAME" = 'v3.1.136' ]; then
            ./gradlew :app:testMobileDebugUnitTest --tests 'com.aliflix.app.ui.MyListGenreGroupingTest'
          elif [ "$GITHUB_REF_NAME" = 'release/v3.1.135' ] || [ "$GITHUB_REF_NAME" = 'v3.1.135' ]; then
            ./gradlew :app:testMobileDebugUnitTest --tests 'com.aliflix.app.player.AudioSubtitleAlignmentTest' --tests 'com.aliflix.app.player.PlaybackSpeechBufferTest'
          elif [ "$GITHUB_REF_NAME" = 'release/v3.1.134' ] || [ "$GITHUB_REF_NAME" = 'v3.1.134' ]; then
            ./gradlew :app:testMobileDebugUnitTest --tests 'com.aliflix.app.player.AudioSubtitleAlignmentTest' --tests 'com.aliflix.app.player.PlaybackSpeechBufferTest' --tests 'com.aliflix.app.player.SubtitleTimingMatchTest'
          elif [ "$GITHUB_REF_NAME" = 'release/v3.1.133' ] || [ "$GITHUB_REF_NAME" = 'v3.1.133' ]; then
            ./gradlew :app:testMobileDebugUnitTest --tests 'com.aliflix.app.player.AudioSubtitleAlignmentTest' --tests 'com.aliflix.app.player.PlaybackSpeechBufferTest' --tests 'com.aliflix.app.recommendation.TastePicksTest' --tests 'com.aliflix.app.account.AccountMergePolicyTest' --tests 'com.aliflix.app.player.SubtitleTimingMatchTest'
          else
