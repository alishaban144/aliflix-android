name: Publish Aliflix Android

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v3.1.63"
      - "release/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.1.63"
        required: true
        type: string
      notes:
        description: "Release notes shown inside Aliflix"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION_CODE: "153"
  RELEASE_VERSION_NAME: "3.1.63"
  EXPECTED_MOBILE_SIGNER_SHA256: "a71ef174c31385c19f260027161ec255ad272ddbd7df1241a27029e8676f3a47"

jobs:
  playback-device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: ["35"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Verify native background playback and browser handoff
        run: bash .github/scripts/test-phone-casting.sh '${{ matrix.api-level }}'
      - name: Upload playback test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-device-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            .validation/emulator.log
            .validation/device-logcat.txt
            .validation/instrumentation.txt

  worker-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: recommendation-worker/package-lock.json

      - name: Typecheck and test recommendation Worker
        working-directory: recommendation-worker
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test

  deploy-recommendations:
    needs: worker-checks
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "2bd02586ce22e6e64d878d35d25e44c9"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: recommendation-worker/package-lock.json

      - name: Upload and deploy recommendation Worker
        working-directory: recommendation-worker
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm ci
          VERSION_TAG="release-${GITHUB_SHA}"
          UPLOAD_OUTPUT="$(
            npx wrangler versions upload \
              --tag "$VERSION_TAG" \
              --message "Aliflix ${RELEASE_VERSION_NAME} release" 2>&1
          )"
          printf '%s\n' "$UPLOAD_OUTPUT"
          CANDIDATE_ID="$(
            sed -nE \
              's/^Worker Version ID:[[:space:]]*([0-9a-fA-F-]{36}).*$/\1/p' \
              <<<"$UPLOAD_OUTPUT"
          )"
          test -n "$CANDIDATE_ID"
          npx wrangler versions deploy \
            "${CANDIDATE_ID}@100%" \
            --message "Aliflix ${RELEASE_VERSION_NAME} release" \
            --yes

  release:
    needs: [worker-checks, deploy-recommendations, playback-device-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version and tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          EXPECTED_TAG="v${RELEASE_VERSION_NAME}"
          GRADLE_VERSION_CODE="$(
            sed -nE 's/^val mobileVersionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' \
              app/build.gradle.kts
          )"
          GRADLE_VERSION_NAME="$(
            sed -nE 's/^val mobileVersionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' \
              app/build.gradle.kts
          )"
          TV_GRADLE_VERSION_CODE="$(
            sed -nE 's/^val tvVersionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' \
              app/build.gradle.kts
          )"
          TV_GRADLE_VERSION_NAME="$(
            sed -nE 's/^val tvVersionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' \
              app/build.gradle.kts
          )"

          test "$GRADLE_VERSION_CODE" = "$RELEASE_VERSION_CODE"
          test "$GRADLE_VERSION_NAME" = "$RELEASE_VERSION_NAME"
          test "$TV_GRADLE_VERSION_CODE" = "$RELEASE_VERSION_CODE"
          test "$TV_GRADLE_VERSION_NAME" = "$RELEASE_VERSION_NAME"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "$REQUESTED_TAG" = "$EXPECTED_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_TYPE}" = "tag"
            test "${GITHUB_REF_NAME}" = "$EXPECTED_TAG"
          else
            test "${GITHUB_REF_TYPE}" = "branch"
            test "${GITHUB_REF_NAME}" = "release/${EXPECTED_TAG}"
          fi

          if git rev-parse --verify --quiet "refs/tags/${EXPECTED_TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "refs/tags/${EXPECTED_TAG}")" = "$GITHUB_SHA"
          fi

          echo "RELEASE_TAG=${EXPECTED_TAG}" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALIFLIX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALIFLIX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIFLIX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALIFLIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aliflix-release.jks"
          keytool \
            -list \
            -keystore "$RUNNER_TEMP/aliflix-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          KEYSTORE_CERT_SHA256="$(
            keytool \
              -exportcert \
              -keystore "$RUNNER_TEMP/aliflix-release.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              | sha256sum \
              | awk '{ print tolower($1) }'
          )"
          echo "Keystore certificate SHA256: $KEYSTORE_CERT_SHA256"
          echo "Expected certificate SHA256: $EXPECTED_MOBILE_SIGNER_SHA256"
          test "$KEYSTORE_CERT_SHA256" = "$EXPECTED_MOBILE_SIGNER_SHA256"

      - name: Test and build mobile and TV releases
        env:
          ALIFLIX_KEYSTORE_FILE: ${{ runner.temp }}/aliflix-release.jks
          ALIFLIX_KEYSTORE_PASSWORD: ${{ secrets.ALIFLIX_KEYSTORE_PASSWORD }}
          ALIFLIX_KEY_ALIAS: ${{ secrets.ALIFLIX_KEY_ALIAS }}
          ALIFLIX_KEY_PASSWORD: ${{ secrets.ALIFLIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            testMobileDebugUnitTest \
            testTvDebugUnitTest \
            lintMobileDebug \
            packageMobileRelease \
            packageTvRelease

      - name: Verify release APKs integrity
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          for FLAVOR in mobile tv; do
            APK_PATH="app/build/outputs/apk/${FLAVOR}/release/app-${FLAVOR}-release.apk"
            echo "Verifying $APK_PATH..."
            test -s "$APK_PATH"
            unzip -tq "$APK_PATH"
            APK_CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1)"
            APK_CERT_SHA256="$(
              printf '%s\n' "$APK_CERT_OUTPUT" \
                | awk 'BEGIN { IGNORECASE = 1 } /certificate SHA-256 digest:/ { line = $0; sub(/^.*digest:[[:space:]]*/, "", line); gsub(/[[:space:]:]/, "", line); print tolower(line) }' \
                | sort -u
            )"
            if [ -z "$APK_CERT_SHA256" ]; then
              printf '%s\n' "$APK_CERT_OUTPUT"
              exit 1
            fi
            echo "$FLAVOR APK signer certificate SHA256: $APK_CERT_SHA256"
            test "$APK_CERT_SHA256" = "$EXPECTED_MOBILE_SIGNER_SHA256"
          done

      - name: Build update manifests
        run: |
          set -euo pipefail
          RELEASE_NOTES="Aliflix v${RELEASE_VERSION_NAME}: Cinematic Intelligence purple/lilac visual identity, redesigned unified action panel, remote-first Android TV experience with accelerated D-pad timeline scrubbing, 0ms instant cached startup, elevated portrait subtitles, and simultaneous mobile & TV releases."

          # Mobile APK and manifest
          MOBILE_APK="app/build/outputs/apk/mobile/release/app-mobile-release.apk"
          MOBILE_SHA256="$(sha256sum "$MOBILE_APK" | awk '{print $1}')"
          MOBILE_SIZE="$(stat -c %s "$MOBILE_APK")"
          MOBILE_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/aliflix-mobile.apk"

          cat <<EOF > update-mobile.json
          {
            "versionCode": ${RELEASE_VERSION_CODE},
            "versionName": "${RELEASE_VERSION_NAME}",
            "apkUrl": "${MOBILE_DOWNLOAD_URL}",
            "sha256": "${MOBILE_SHA256}",
            "sizeBytes": ${MOBILE_SIZE},
            "minimumSdk": 29,
            "notes": "${RELEASE_NOTES}",
            "releaseNotes": "${RELEASE_NOTES}"
          }
          EOF
          cp "$MOBILE_APK" aliflix-mobile.apk

          # TV APK and manifest
          TV_APK="app/build/outputs/apk/tv/release/app-tv-release.apk"
          TV_SHA256="$(sha256sum "$TV_APK" | awk '{print $1}')"
          TV_SIZE="$(stat -c %s "$TV_APK")"
          TV_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/aliflix-tv.apk"

          cat <<EOF > update-tv.json
          {
            "versionCode": ${RELEASE_VERSION_CODE},
            "versionName": "${RELEASE_VERSION_NAME}-tv",
            "apkUrl": "${TV_DOWNLOAD_URL}",
            "sha256": "${TV_SHA256}",
            "sizeBytes": ${TV_SIZE},
            "minimumSdk": 30,
            "notes": "${RELEASE_NOTES}",
            "releaseNotes": "${RELEASE_NOTES}"
          }
          EOF
          cp "$TV_APK" aliflix-tv.apk

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Aliflix ${{ env.RELEASE_VERSION_NAME }}"
          body: "Aliflix v${{ env.RELEASE_VERSION_NAME }}: Cinematic Intelligence purple/lilac visual identity, unified mobile detail action panel, remote-first Android TV experience with accelerated D-pad timeline scrubbing, 0ms instant cached startup, elevated portrait subtitles, and simultaneous mobile & TV releases."
          files: |
            aliflix-mobile.apk
            aliflix-tv.apk
            update-mobile.json
            update-tv.json
