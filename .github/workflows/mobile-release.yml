      - name: Verify release APKs integrity
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          for FLAVOR in mobile; do
            APK_PATH="app/build/outputs/apk/${FLAVOR}/release/app-${FLAVOR}-release.apk"
            echo "Verifying $APK_PATH..."
            test -s "$APK_PATH"
            unzip -tq "$APK_PATH"
            APK_CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1)"
            APK_CERT_SHA256="$(
              printf '%s\n' "$APK_CERT_OUTPUT" \
                | awk 'BEGIN { IGNORECASE = 1 } /certificate SHA-256 digest:/ { line = $0; sub(/^.*digest:[[:space:]]*/, "", line); gsub(/[[:space:]:]/, "", line); print tolower(line) }' \
                | sort -u
            )"
            if [ -z "$APK_CERT_SHA256" ]; then
              printf '%s\n' "$APK_CERT_OUTPUT"
              exit 1
            fi
            echo "$FLAVOR APK signer certificate SHA256: $APK_CERT_SHA256"
            test "$APK_CERT_SHA256" = "$EXPECTED_MOBILE_SIGNER_SHA256"
          done

      - name: Build update manifests
        run: |
          set -euo pipefail
          RELEASE_NOTES="Aliflix v${RELEASE_VERSION_NAME}: Sync with Audio uses automatically accumulated playback speech and verified references, with a single under-20-second deadline covering collection, downloads and analysis. Fixed PCM timestamp gaps and phrase correlation. Physical Pixel tests verified actual film subtitle correction, downloaded offset/framerate/edit corrections, ambiguity rejection, Cancel and Reset. Arabic direction and dedicated Japanese anime sources retained. Mobile only."

          # Mobile APK and manifest
          MOBILE_APK="app/build/outputs/apk/mobile/release/app-mobile-release.apk"
          MOBILE_SHA256="$(sha256sum "$MOBILE_APK" | awk '{print $1}')"
          MOBILE_SIZE="$(stat -c %s "$MOBILE_APK")"
          MOBILE_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/aliflix-mobile.apk"

          cat <<EOF > update-mobile.json
          {
            "versionCode": ${RELEASE_VERSION_CODE},
            "versionName": "${RELEASE_VERSION_NAME}",
            "apkUrl": "${MOBILE_DOWNLOAD_URL}",
            "sha256": "${MOBILE_SHA256}",
            "sizeBytes": ${MOBILE_SIZE},
            "minimumSdk": 29,
            "notes": "${RELEASE_NOTES}",
            "releaseNotes": "${RELEASE_NOTES}"
          }
          EOF
          cp "$MOBILE_APK" aliflix-mobile.apk

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Aliflix ${{ env.RELEASE_VERSION_NAME }}"
          body: |
            Sync with Audio now has one 19-second analysis deadline, leaving presentation headroom within 20 seconds. The deadline includes reference downloads, evidence collection, cache scans and CPU fitting. Cancel and Reset remain in the existing Audio & Subtitles panel; playback continues uninterrupted. Late results cannot change subtitles after timeout, cancellation or a source/audio/subtitle/account change.

            Fixed a real PCM timestamp rounding defect that duplicated or skipped fingerprint bins at half-bin boundaries. Useful partial speech blocks are available immediately. Phrase-level correlation handles natural syllable pauses; joint peak uniqueness and independent scenes verify the proposed clock. Vocal music without informative captions does not invalidate real dialogue; contradictory captioned scenes still reject the correction. Downloaded audio-only analysis waits for the complete cached scan before committing its timing model.

            Physical Pixel 7a / Android 17 validation used the actual Tears of Steel movie and its published English captions shifted by 7.25 seconds. After 85 seconds of normal-speed playback accumulated speech automatically, one tap synchronized in 506 ms with a -7.28-second correction, no seek, no rebuffer and no playback interruption. A tap during its silent opening ended as Unable to Verify in 19.04 seconds, applying no guess. These are measured examples; silence and ambiguous evidence cannot establish timing reliably.

            The downloaded 322-second human-speech recording independently verified constant offset in 6.24 seconds, 25/24 framerate mismatch in 6.25 seconds and edited-scene correction in 6.62 seconds. Ambiguous edits were rejected in 7.69 seconds. Immutable original timestamps, independent manual delay and Reset were checked on the phone. Real captured movie fingerprints are now a permanent host regression, alongside deadline, seek, contradictory-scene and native WebRTC/ONNX tests.

            The final fully R8-minified v3.1.148 APK passed an independent Android driver through the actual Audio & Subtitles controls: the real film synchronized in 1.043 seconds with a -7.32-second correction, then Reset passed. Normal-speed streaming tests separately verified offset in 746 ms and 25/24 framerate correction in 509 ms using automatically accumulated history. Mobile host tests passed 440 cases with zero failures (three opt-in checks skipped); real JNI WebRTC/ONNX and recorded-film checks also passed separately.

            Original timestamp ownership, stable correction identities, Firebase account synchronisation, Cast conversion, Arabic paragraph direction and dedicated Miruro/AniKuro Japanese anime routing are preserved. No streaming-video scan, microphone, Python runtime or separate FFmpeg process is introduced. TV and the recommendation Worker are unchanged. Mobile unit, lint, signing and published artifact checks remain release gates; no emulator is used, as requested.

          files: |
            aliflix-mobile.apk
            update-mobile.json
