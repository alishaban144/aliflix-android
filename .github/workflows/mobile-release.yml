      - name: Verify release APKs integrity
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          for FLAVOR in mobile; do
            APK_PATH="app/build/outputs/apk/${FLAVOR}/release/app-${FLAVOR}-release.apk"
            echo "Verifying $APK_PATH..."
            test -s "$APK_PATH"
            unzip -tq "$APK_PATH"
            APK_CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1)"
            APK_CERT_SHA256="$(
              printf '%s\n' "$APK_CERT_OUTPUT" \
                | awk 'BEGIN { IGNORECASE = 1 } /certificate SHA-256 digest:/ { line = $0; sub(/^.*digest:[[:space:]]*/, "", line); gsub(/[[:space:]:]/, "", line); print tolower(line) }' \
                | sort -u
            )"
            if [ -z "$APK_CERT_SHA256" ]; then
              printf '%s\n' "$APK_CERT_OUTPUT"
              exit 1
            fi
            echo "$FLAVOR APK signer certificate SHA256: $APK_CERT_SHA256"
            test "$APK_CERT_SHA256" = "$EXPECTED_MOBILE_SIGNER_SHA256"
          done

      - name: Verify unchanged ARM64 binaries and original Silero model
        run: |
          curl --fail --location --retry 3 -o baseline-mobile.apk https://github.com/${{ github.repository }}/releases/download/v3.1.164/aliflix-mobile.apk
          python .github/scripts/verify-mobile-native.py baseline-mobile.apk app/build/outputs/apk/mobile/release/app-mobile-release.apk --bridge aliflix-mobile-compat.apk --report native-parity.json
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs aliflix-mobile-compat.apk | grep -i "$EXPECTED_MOBILE_SIGNER_SHA256"
          unzip -tq aliflix-mobile-compat.apk

      - name: Build update manifests
        run: |
          set -euo pipefail
          RELEASE_NOTES="Talk now uses one Gemini Live voice with native interruption, multilingual conversation, secure direct streaming and verified film knowledge. Automatic source recovery, original-language audio alternatives, episode rating matching and refined mobile controls."

          # Mobile APK and manifest
          MOBILE_APK="app/build/outputs/apk/mobile/release/app-mobile-release.apk"
          MOBILE_SHA256="$(sha256sum "$MOBILE_APK" | awk '{print $1}')"
          MOBILE_SIZE="$(stat -c %s "$MOBILE_APK")"
          MOBILE_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/aliflix-mobile.apk"

          cat <<EOF > update-mobile-arm64.json
          {
            "versionCode": ${RELEASE_VERSION_CODE},
            "versionName": "${RELEASE_VERSION_NAME}",
            "apkUrl": "${MOBILE_DOWNLOAD_URL}",
            "sha256": "${MOBILE_SHA256}",
            "sizeBytes": ${MOBILE_SIZE},
            "supportedAbis": ["arm64-v8a"],
            "minimumSdk": 29,
            "notes": "${RELEASE_NOTES}",
            "releaseNotes": "${RELEASE_NOTES}"
          }
          EOF
          cp "$MOBILE_APK" aliflix-mobile.apk
          # Older clients ignore unknown manifest ABI fields, so their URL must
          # continue to advertise the universal bridge, never the ARM64 APK.
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path('aliflix-mobile-compat.apk')
          bridge = dict(versionCode=261, versionName='3.1.171', minimumSdk=29,
              apkUrl=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}/aliflix-mobile-compat.apk",
              sha256=hashlib.sha256(apk.read_bytes()).hexdigest(), sizeBytes=apk.stat().st_size,
              notes='Update compatibility. ARM64 devices can then install the latest mobile release.')
          Path('update-mobile.json').write_text(json.dumps(bridge, indent=2)+'\n')
          PY

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Aliflix ${{ env.RELEASE_VERSION_NAME }}"
          body: |
            Mobile-only: Talk starts listening automatically after microphone permission. Teardown is idempotent and preserves the parent app. The simplified voice screen has continuous audio-reactive lighting, more expressive eyes, animated readable type and stable semantic conversation themes.

            Talk can use actual Aliflix viewing progress, completed episode ranges and saved/favorite identities, resolved through independent TVMaze/Wikidata sources on demand. Gemini 3.8 Live and Aoede remain the sole voice/model; no new speech engine or bundled model is introduced.

            Playback and download preferences show two inline quality choices. IMDb season ratings merge partial host responses and accept verified parent/episode identity across localized titles. No ratings are fabricated when an upstream source has no score.

            ARM64-only main APK with the existing signed universal compatibility bridge and architecture-aware updater. Native/model parity is verified by the workflow. TV is unchanged.

            Validation: docs/mobile-172-validation.md.
          files: |
            aliflix-mobile.apk
            update-mobile.json
            update-mobile-arm64.json
            aliflix-mobile-compat.apk
            native-parity.json
