name: Publish Aliflix Android

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v3.1.7"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.1.7"
        required: true
        type: string
      notes:
        description: "Release notes shown inside Aliflix"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION_CODE: "97"
  RELEASE_VERSION_NAME: "3.1.7"
  EXPECTED_MOBILE_SIGNER_SHA256: "a71ef174c31385c19f260027161ec255ad272ddbd7df1241a27029e8676f3a47"

jobs:
  worker-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: recommendation-worker/package-lock.json

      - name: Typecheck and test recommendation Worker
        working-directory: recommendation-worker
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test

  deploy-recommendations:
    needs: worker-checks
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "2bd02586ce22e6e64d878d35d25e44c9"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: recommendation-worker/package-lock.json

      - name: Deploy recommendation Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: recommendation-worker
        run: |
          set -euo pipefail
          npm ci
          npm run deploy

      - name: Record unavailable Worker credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Cloudflare deployment skipped because repository deployment secrets are not configured."

  release:
    needs: worker-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version and tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          EXPECTED_TAG="v${RELEASE_VERSION_NAME}"
          GRADLE_VERSION_CODE="$(
            sed -nE 's/^val mobileVersionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' \
              app/build.gradle.kts
          )"
          GRADLE_VERSION_NAME="$(
            sed -nE 's/^val mobileVersionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' \
              app/build.gradle.kts
          )"

          test "$GRADLE_VERSION_CODE" = "$RELEASE_VERSION_CODE"
          test "$GRADLE_VERSION_NAME" = "$RELEASE_VERSION_NAME"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "$REQUESTED_TAG" = "$EXPECTED_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_TYPE}" = "tag"
            test "${GITHUB_REF_NAME}" = "$EXPECTED_TAG"
          else
            test "${GITHUB_REF_TYPE}" = "branch"
            test "${GITHUB_REF_NAME}" = "release/v3.0.7"
          fi

          if git rev-parse --verify --quiet "refs/tags/${EXPECTED_TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "refs/tags/${EXPECTED_TAG}")" = "$GITHUB_SHA"
          fi

          echo "RELEASE_TAG=${EXPECTED_TAG}" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALIFLIX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALIFLIX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIFLIX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALIFLIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aliflix-release.jks"
          keytool \
            -list \
            -keystore "$RUNNER_TEMP/aliflix-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          KEYSTORE_CERT_SHA256="$(
            keytool \
              -exportcert \
              -keystore "$RUNNER_TEMP/aliflix-release.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              | sha256sum \
              | awk '{ print tolower($1) }'
          )"
          echo "Keystore certificate SHA256: $KEYSTORE_CERT_SHA256"
          echo "Expected certificate SHA256: $EXPECTED_MOBILE_SIGNER_SHA256"
          test "$KEYSTORE_CERT_SHA256" = "$EXPECTED_MOBILE_SIGNER_SHA256"

      - name: Test and build mobile only
        env:
          ALIFLIX_KEYSTORE_FILE: ${{ runner.temp }}/aliflix-release.jks
          ALIFLIX_KEYSTORE_PASSWORD: ${{ secrets.ALIFLIX_KEYSTORE_PASSWORD }}
          ALIFLIX_KEY_ALIAS: ${{ secrets.ALIFLIX_KEY_ALIAS }}
          ALIFLIX_KEY_PASSWORD: ${{ secrets.ALIFLIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            testMobileDebugUnitTest \
            packageMobileRelease

      - name: Verify release APK integrity
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/mobile/release/app-mobile-release.apk"
          test -s "$APK_PATH"
          unzip -tq "$APK_PATH"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          APK_CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1)"
          APK_CERT_SHA256="$(
            printf '%s\n' "$APK_CERT_OUTPUT" \
              | awk 'BEGIN { IGNORECASE = 1 } /certificate SHA-256 digest:/ { line = $0; sub(/^.*digest:[[:space:]]*/, "", line); gsub(/[[:space:]:]/, "", line); print tolower(line) }' \
              | sort -u
          )"
          if [ -z "$APK_CERT_SHA256" ]; then
            printf '%s\n' "$APK_CERT_OUTPUT"
            exit 1
          fi
          echo "APK signer certificate SHA256: $APK_CERT_SHA256"
          test "$APK_CERT_SHA256" = "$EXPECTED_MOBILE_SIGNER_SHA256"

      - name: Build mobile update manifest
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/mobile/release/app-mobile-release.apk"
          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          SIZE="$(stat -c %s "$APK_PATH")"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/aliflix-mobile.apk"

          cat <<EOF > update-mobile.json
          {
            "versionCode": ${RELEASE_VERSION_CODE},
            "versionName": "${RELEASE_VERSION_NAME}",
            "apkUrl": "${DOWNLOAD_URL}",
            "sha256": "${SHA256}",
            "sizeBytes": ${SIZE},
            "releaseNotes": "Fixes IMDb rating identity and stale-cache mismatches, keeps TMDB and IMDb values source-correct, and reveals TMDB, IMDb, and Rotten Tomatoes ratings together."
          }
          EOF
          cp "$APK_PATH" aliflix-mobile.apk

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Aliflix ${{ env.RELEASE_VERSION_NAME }}"
          body: "Mobile-only patch fixing IMDb rating identity and stale-cache mismatches, keeping TMDB and IMDb values source-correct, and revealing TMDB, IMDb, and Rotten Tomatoes ratings together."
          files: |
            aliflix-mobile.apk
            update-mobile.json
