name: Prepare v3.1.89 UI patch
on:
  push:
    branches:
      - automation/title-contrast-v3.1.89
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply UI fix and push dedicated review branch
        run: |
          set -euo pipefail
          python3 .github/scripts/fix-title-contrast-v3189.py
          git restore .github/workflows/mobile-release.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/com/aliflix/app/ui/AliflixApp.kt app/src/main/java/com/aliflix/app/ui/theme/AliflixTheme.kt
          git commit -m 'v3.1.89: fix text contrast and detail back button'
          git push origin HEAD:refs/heads/fix/title-contrast-v3.1.89
