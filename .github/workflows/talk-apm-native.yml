name: Build Talk echo processor
on:
  push:
    branches: ['codex/talk-184-device-duplex-audit']
    paths:
      - '.github/workflows/talk-apm-native.yml'
      - '.github/scripts/build-talk-apm.py'
      - 'app/src/mobile/cpp/talk_apm.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned tools
        run: |
          python -m pip install meson==1.6.1 ninja==1.11.1.3
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
      - name: Build unmodified APM and JNI
        run: python .github/scripts/build-talk-apm.py --abi '${{ matrix.abi }}' --ndk "$ANDROID_HOME/ndk/27.2.12479018" --output .validation/apm-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: talk-apm-${{ matrix.abi }}
          path: .validation/apm-artifact/
          if-no-files-found: error
