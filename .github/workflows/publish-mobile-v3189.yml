name: Publish Aliflix mobile v3.1.89

on:
  push:
    branches:
      - fix/title-contrast-v3.1.89-clean

permissions:
  contents: write

concurrency:
  group: aliflix-mobile-v3.1.89
  cancel-in-progress: false

jobs:
  release-mobile:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION_NAME: '3.1.89'
      RELEASE_VERSION_CODE: '179'
      EXPECTED_MOBILE_SIGNER_SHA256: 'a71ef174c31385c19f260027161ec255ad272ddbd7df1241a27029e8676f3a47'
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify version and release is not already published
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/title-contrast-v3.1.89-clean'
          git merge-base --is-ancestor v3.1.88 "$GITHUB_SHA"
          test "$(sed -nE 's/^val mobileVersionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' app/build.gradle.kts)" = "$RELEASE_VERSION_CODE"
          test "$(sed -nE 's/^val mobileVersionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' app/build.gradle.kts)" = "$RELEASE_VERSION_NAME"
          if git ls-remote --exit-code origin refs/tags/v3.1.89 >/dev/null; then
            echo 'v3.1.89 already exists; refusing to replace its release.' >&2
            exit 1
          fi
          git diff --check v3.1.88 "$GITHUB_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore original production signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALIFLIX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALIFLIX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIFLIX_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aliflix-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/aliflix-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT_SHA256="$(keytool -exportcert -keystore "$RUNNER_TEMP/aliflix-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | awk '{print tolower($1)}')"
          test "$CERT_SHA256" = "$EXPECTED_MOBILE_SIGNER_SHA256"

      - name: Package signed Android mobile release (no tests or emulator)
        env:
          ALIFLIX_KEYSTORE_FILE: ${{ runner.temp }}/aliflix-release.jks
          ALIFLIX_KEYSTORE_PASSWORD: ${{ secrets.ALIFLIX_KEYSTORE_PASSWORD }}
          ALIFLIX_KEY_ALIAS: ${{ secrets.ALIFLIX_KEY_ALIAS }}
          ALIFLIX_KEY_PASSWORD: ${{ secrets.ALIFLIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew packageMobileRelease

      - name: Verify signed APK and produce update manifest
        run: |
          set -euo pipefail
          APK_PATH='app/build/outputs/apk/mobile/release/app-mobile-release.apk'
          test -s "$APK_PATH"
          unzip -tq "$APK_PATH"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          APK_CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1)"
          APK_CERT_SHA256="$(printf '%s\n' "$APK_CERT_OUTPUT" | awk 'BEGIN { IGNORECASE = 1 } /certificate SHA-256 digest:/ { line = $0; sub(/^.*digest:[[:space:]]*/, "", line); gsub(/[[:space:]:]/, "", line); print tolower(line) }' | sort -u)"
          test -n "$APK_CERT_SHA256"
          test "$APK_CERT_SHA256" = "$EXPECTED_MOBILE_SIGNER_SHA256"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_SIZE="$(stat -c %s "$APK_PATH")"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${RELEASE_VERSION_NAME}/aliflix-mobile.apk"
          RELEASE_NOTES='Aliflix v3.1.89: Restore white movie and series titles throughout the mobile app and improve the details back button visibility.'
          cat > update-mobile.json <<EOF
          {
            "versionCode": ${RELEASE_VERSION_CODE},
            "versionName": "${RELEASE_VERSION_NAME}",
            "apkUrl": "${DOWNLOAD_URL}",
            "sha256": "${APK_SHA256}",
            "sizeBytes": ${APK_SIZE},
            "minimumSdk": 29,
            "notes": "${RELEASE_NOTES}",
            "releaseNotes": "${RELEASE_NOTES}"
          }
          EOF
          python3 -m json.tool update-mobile.json >/dev/null
          cp "$APK_PATH" aliflix-mobile.apk

      - name: Publish v3.1.89 and attach update files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.89
          target_commitish: ${{ github.sha }}
          name: Aliflix 3.1.89
          body: 'Fix white movie and series title contrast across mobile screens and improve detail-page back button visibility. Unit tests and emulator validation skipped by request; signed release APK integrity verified.'
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            aliflix-mobile.apk
            update-mobile.json
