name: v3.1.91 mobile compile check

on:
  push:
    branches:
      - fix/v3.1.91-discover-trailer-regressions

permissions:
  contents: read

jobs:
  compile-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile phone app without tests or emulators
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew compileMobileDebugKotlin --no-daemon
