name: Publish Aliflix TV

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example tv-v2.0"
        required: true
        type: string
      notes:
        description: "Release notes shown inside Aliflix TV"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALIFLIX_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aliflix-release.jks"

      - name: Build signed Android TV APK
        env:
          ALIFLIX_KEYSTORE_FILE: ${{ runner.temp }}/aliflix-release.jks
          ALIFLIX_KEYSTORE_PASSWORD: ${{ secrets.ALIFLIX_KEYSTORE_PASSWORD }}
          ALIFLIX_KEY_ALIAS: ${{ secrets.ALIFLIX_KEY_ALIAS }}
          ALIFLIX_KEY_PASSWORD: ${{ secrets.ALIFLIX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -PALIFLIX_UPDATE_MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/update-tv.json" \
            testTvReleaseUnitTest lintTvRelease assembleTvRelease

      - name: Prepare release assets
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/tv/release/app-tv-release.apk dist/aliflix-tv-release.apk
          VERSION_CODE="$(jq -r '.elements[0].versionCode' app/build/outputs/apk/tv/release/output-metadata.json)"
          VERSION_NAME="$(jq -r '.elements[0].versionName' app/build/outputs/apk/tv/release/output-metadata.json)"
          SHA256="$(sha256sum dist/aliflix-tv-release.apk | cut -d ' ' -f 1)"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/aliflix-tv-release.apk" \
            --arg sha256 "$SHA256" \
            --arg notes "$RELEASE_NOTES" \
            '{
              versionCode: $versionCode,
              versionName: $versionName,
              apkUrl: $apkUrl,
              sha256: $sha256,
              minimumSdk: 30,
              notes: $notes
            }' > dist/update-tv.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(jq -r '.versionName' dist/update-tv.json)"
          gh release create "${{ inputs.tag }}" \
            dist/aliflix-tv-release.apk \
            dist/update-tv.json \
            --title "Aliflix TV ${VERSION_NAME}" \
            --notes "${{ inputs.notes }}"
